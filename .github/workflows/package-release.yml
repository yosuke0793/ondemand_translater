name: Native packages and draft release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: packaging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: windows-x64
            architecture: x64
          - runner: macos-15
            target: macos-arm64
            architecture: arm64
          - runner: macos-15-intel
            target: macos-x64
            architecture: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (Node.js 24)
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6 (Node.js 24)
        with:
          python-version: "3.12.10"
          architecture: ${{ matrix.architecture }}
      - name: Validate version and tag before installing dependencies
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            python packaging/build.py validate --expected-tag "$REF_NAME"
          else
            python packaging/build.py validate
          fi
      - name: Build Windows installer and portable bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/build-windows.ps1 -Python312 (Get-Command python).Source
      - name: Test per-user Windows installer and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = (Get-ChildItem packaging/artifacts/*-setup.exe).FullName
          $installDir = Join-Path $PWD "packaging/.work/installed-smoke"
          $process = Start-Process $installer -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=`"$installDir`"", "/GROUP=`"TranslateService Packaging Smoke`"" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          try {
            & packaging/.venv-build/Scripts/python.exe packaging/build.py verify --bundle $installDir --target windows-x64
            if ($LASTEXITCODE -ne 0) { throw "Installed package self-test failed" }
          } finally {
            $process = Start-Process (Join-Path $installDir "unins000.exe") -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Uninstall failed: $($process.ExitCode)" }
          }
      - name: Prepare macOS native build tools
        if: runner.os == 'macOS'
        shell: bash
        run: brew install cmake pkg-config nasm
      - name: Build and mount-test macOS disk image
        if: runner.os == 'macOS'
        shell: bash
        run: PYTHON312="$(command -v python)" bash packaging/build-macos.sh
      - name: Upload only verified distribution files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: TranslateService-${{ matrix.target }}
          path: packaging/artifacts/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Preserve self-test reports after a failed build
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: TranslateService-${{ matrix.target }}-diagnostics
          path: packaging/.work/smoke/**/*.json
          if-no-files-found: warn
          retention-days: 14

  draft-release:
    name: Create draft after every native build succeeds
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (Node.js 24)
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: TranslateService-*
          path: packaging/artifacts
          merge-multiple: true
      - name: Validate complete asset set and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 packaging/release.py --tag "$RELEASE_TAG" --check-only
      - name: Create draft release (never publish automatically)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 packaging/release.py --tag "$RELEASE_TAG"
